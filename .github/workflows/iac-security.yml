# =============================================================================
# IaC Security Framework — Full Pipeline
#
# Accepts a GitHub repository URL, clones it, discovers Terraform directories,
# runs terraform fmt/init/validate, executes Checkov + Trivy static scanning,
# normalizes findings with local severity mapping, generates combined forensic
# evidence reports, generates Terraform plan JSON, runs custom Rego policies
# via Conftest, and produces forensic-ready evidence at every stage.
#
# Static analysis is NON-BLOCKING — findings are preserved as evidence.
# Policy-as-Code runs in ADVISORY mode by default — violations are recorded
# as findings but do not stop the pipeline.  Set POLICY_ENFORCEMENT_MODE
# to 'blocking' to enforce hard pipeline failure on policy violations.
#
# Every step is traceable via SCAN_ID.
# =============================================================================

name: IaC Security Framework

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      repo_url:
        description: "GitHub repository URL to scan"
        required: true
      branch:
        description: "Branch to scan"
        required: false
        default: "main"

jobs:
  security-pipeline:
    name: Security Pipeline
    runs-on: ubuntu-latest

    steps:
      # ================================================================
      # SETUP
      # ================================================================

      - name: Checkout framework repository
        uses: actions/checkout@v4

      - name: Generate SCAN_ID
        id: scan
        run: |
          SCAN_ID="SCAN-$(uuidgen | cut -c1-8)"
          echo "SCAN_ID=$SCAN_ID" >> "$GITHUB_ENV"
          echo "scan_id=$SCAN_ID" >> "$GITHUB_OUTPUT"
          echo "Generated SCAN_ID = $SCAN_ID"

      - name: Resolve repository URL and branch
        run: |
          if [ -n "${{ github.event.inputs.repo_url }}" ]; then
            echo "REPO_URL=${{ github.event.inputs.repo_url }}" >> "$GITHUB_ENV"
          else
            echo "REPO_URL=https://github.com/${{ github.repository }}.git" >> "$GITHUB_ENV"
          fi

          if [ -n "${{ github.event.inputs.branch }}" ]; then
            echo "BRANCH=${{ github.event.inputs.branch }}" >> "$GITHUB_ENV"
          else
            REF="${GITHUB_REF##refs/heads/}"
            echo "BRANCH=${REF:-main}" >> "$GITHUB_ENV"
          fi

      - name: Print scan parameters
        run: |
          echo "========================================"
          echo "  SCAN_ID  = $SCAN_ID"
          echo "  REPO_URL = $REPO_URL"
          echo "  BRANCH   = $BRANCH"
          echo "========================================"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # ================================================================
      # INSTALL SECURITY SCANNERS
      # ================================================================

      - name: Install Checkov
        run: |
          pip install checkov
          echo "--- Checkov version ---"
          checkov --version

      - name: Install Trivy
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
          echo "--- Trivy version ---"
          trivy --version

      - name: Install Conftest
        run: |
          CONFTEST_VERSION="0.56.0"
          wget -qO - "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" | tar xz -C /usr/local/bin conftest
          echo "--- Conftest version ---"
          conftest --version

      # ================================================================
      # STAGE 1-3: CLONE, METADATA, DISCOVERY
      # ================================================================

      - name: "Stage 1: Clone target repository"
        run: python scripts/clone_repository.py

      - name: "Stage 2: Generate scan metadata (SHA256 hashes)"
        run: python scripts/generate_scan_metadata.py

      - name: "Stage 3: Discover Terraform directories"
        run: python scripts/discover_terraform.py

      # ================================================================
      # STAGE 4: TERRAFORM VALIDATION
      # ================================================================

      - name: "Stage 4: Terraform validation (fmt / init / validate)"
        id: terraform_validation
        continue-on-error: true
        run: python scripts/terraform_validate.py

      # ================================================================
      # STAGE 5: CHECKOV SCAN (primary scanner)
      # ================================================================

      - name: "Stage 5: Checkov static security scan"
        id: checkov_scan
        if: steps.terraform_validation.outcome == 'success'
        continue-on-error: true
        run: python scripts/checkov_scan.py

      - name: "Stage 5 (skipped): Checkov scan skipped — validation failed"
        if: steps.terraform_validation.outcome != 'success'
        run: |
          echo "========================================"
          echo "  Checkov scan SKIPPED"
          echo "  Reason: Terraform validation failed"
          echo "  SCAN_ID = $SCAN_ID"
          echo "========================================"

      # ================================================================
      # STAGE 6: TRIVY CONFIG SCAN (secondary scanner)
      # ================================================================

      - name: "Stage 6: Trivy config scan"
        id: trivy_scan
        if: steps.terraform_validation.outcome == 'success'
        continue-on-error: true
        run: python scripts/trivy_scan.py

      - name: "Stage 6 (skipped): Trivy scan skipped — validation failed"
        if: steps.terraform_validation.outcome != 'success'
        run: |
          echo "  Trivy scan SKIPPED — Terraform validation failed"

      # ================================================================
      # STAGE 7: COMBINED EVIDENCE REPORT
      # ================================================================

      - name: "Stage 7: Generate combined static analysis report"
        if: steps.terraform_validation.outcome == 'success'
        run: python scripts/static_analysis_report.py

      # ================================================================
      # STAGE 8: PREPARE POLICY VALIDATION INPUT (non-blocking)
      # ================================================================

      - name: "Stage 8: Prepare policy validation input"
        if: steps.terraform_validation.outcome == 'success'
        run: python scripts/prepare_policy_validation_input.py
      # ================================================================
      # STAGE 9: POLICY-AS-CODE (advisory mode — findings recorded)
      # ================================================================

      - name: "Stage 9: Policy-as-Code checks (Conftest / Rego)"
        id: policy_enforcement
        if: steps.terraform_validation.outcome == 'success'
        run: python scripts/policy_runner.py
        env:
          POLICY_ENFORCEMENT_MODE: advisory
          POLICY_INPUT_MODE: source

      - name: "Stage 9 (skipped): Policy checks skipped — validation failed"
        if: steps.terraform_validation.outcome != 'success'
        run: |
          echo "  Policy checks SKIPPED — Terraform validation failed"

      # ================================================================
      # STAGE 10: UPDATE COMBINED REPORT (post-policy)
      # ================================================================

      - name: "Stage 10: Regenerate combined report with policy results"
        if: steps.terraform_validation.outcome == 'success'
        run: python scripts/static_analysis_report.py

      # ================================================================
      # STAGE 11: CONSOLE OUTPUT
      # ================================================================

      - name: "Stage 11: Print combined findings to console"
        if: steps.terraform_validation.outcome == 'success'
        run: python scripts/list_findings.py ${{ steps.scan.outputs.scan_id }}

      # ================================================================
      # STAGE 12-20: CIS-DRIVEN AI-ASSISTED RISK SCORING
      # ================================================================

      - name: "Stage 12: Normalize findings for risk scoring"
        if: steps.terraform_validation.outcome == 'success'
        run: python scripts/risk/normalize_findings.py "$SCAN_ID"

      - name: "Stage 13: Deterministically map known findings"
        if: steps.terraform_validation.outcome == 'success'
        run: python scripts/risk/deterministic_map_known_findings.py "$SCAN_ID"

      - name: "Stage 14: AI-map unmapped findings to CIS"
        if: steps.terraform_validation.outcome == 'success'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-nano' }}
        run: python scripts/risk/ai_map_unmapped_findings.py "$SCAN_ID"

      - name: "Stage 15: Validate CIS mappings"
        if: steps.terraform_validation.outcome == 'success'
        run: python scripts/risk/validate_cis_mapping.py "$SCAN_ID"

      - name: "Stage 16: Merge CIS mappings"
        if: steps.terraform_validation.outcome == 'success'
        run: python scripts/risk/merge_mappings.py "$SCAN_ID"

      - name: "Stage 17: Calculate pre-deployment risk score"
        if: steps.terraform_validation.outcome == 'success'
        run: python scripts/risk/calculate_risk_score.py "$SCAN_ID"

      - name: "Stage 18: Render risk summary"
        if: steps.terraform_validation.outcome == 'success'
        run: python scripts/risk/render_risk_summary.py "$SCAN_ID"

      - name: "Stage 19: Hash risk evidence"
        if: steps.terraform_validation.outcome == 'success'
        run: python scripts/risk/hash_risk_evidence.py "$SCAN_ID"

      # ================================================================
      # STAGE 21: RISK GATE ENFORCEMENT
      # ================================================================

      - name: "Stage 20: Enforce advisory risk gate"
        if: steps.terraform_validation.outcome == 'success'
        env:
          ENFORCE_RISK_GATE: ${{ vars.ENFORCE_RISK_GATE || 'false' }}
          STRICT_RISK_GATE: ${{ vars.STRICT_RISK_GATE || 'false' }}
        run: python scripts/risk/enforce_risk_gate.py "$SCAN_ID"

      # ================================================================
      # ARTIFACT UPLOAD (always — even on failure)
      # ================================================================

      - name: Upload scan metadata artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-metadata-${{ steps.scan.outputs.scan_id }}
          path: repositories/metadata/${{ steps.scan.outputs.scan_id }}/

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-reports-${{ steps.scan.outputs.scan_id }}
          path: reports/static/${{ steps.scan.outputs.scan_id }}/

      - name: Upload policy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-reports-${{ steps.scan.outputs.scan_id }}
          path: reports/policy/${{ steps.scan.outputs.scan_id }}/

      - name: Upload risk scoring reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-reports-${{ steps.scan.outputs.scan_id }}
          path: reports/risk/${{ steps.scan.outputs.scan_id }}/

      # ---- Future stages (not yet implemented) ----
      # - AWS sandbox deployment
      # - Prowler runtime validation
      # - Forensic evidence package generation
