# =============================================================================
# FILE: .github/workflows/iac-security.yml
# PROJECT: iac-security-framework
# PURPOSE: GitHub Actions CI/CD pipeline for forensic-ready IaC security scanning
# =============================================================================
#
# INPUT MODEL:
#   This pipeline accepts a GitHub repository URL as its primary input.
#   It does NOT require a pre-uploaded Terraform directory.
#   The framework clones and dynamically analyses any provided repository.
#
# FUTURE WORKFLOW STAGES (to be implemented incrementally):
#
# STAGE 1 — REPOSITORY CLONING & SCAN INITIALISATION
#   - Accept repository URL and branch as workflow inputs
#   - Run clone_repository.py:
#       - Generate unique scan_id (SCAN-<UUID-prefix>)
#       - Clone repository into repositories/cloned/<scan_id>/
#       - Record commit SHA and clone timestamp
#   - Run generate_scan_metadata.py:
#       - Calculate SHA256 hashes of all discovered .tf files
#       - Assemble and save scan metadata to repositories/metadata/
#
# STAGE 2 — TERRAFORM DISCOVERY
#   - Run discover_terraform.py against repositories/cloned/<scan_id>/
#   - Recursively find all .tf files
#   - Identify Terraform root modules (supports flat, multi-module, monorepos)
#   - Save terraform-discovery.json to reports/static/<scan_id>/
#
# STAGE 3 — TERRAFORM STATIC VALIDATION
#   - For each discovered root module:
#       - Run: terraform fmt -check    (enforce formatting standards)
#       - Run: terraform init          (initialise provider plugins)
#       - Run: terraform validate      (validate HCL syntax and structure)
#   - Capture output and attach scan_id to results
#
# STAGE 4 — STATIC IAC MISCONFIGURATION SCANNING (Checkov)
#   - Run Checkov against each discovered root module directory
#   - Output results as JSON to reports/static/<scan_id>/checkov-report.json
#   - Run normalize_checkov.py to normalise findings and tag with scan_id
#   - Save normalized-findings.json to reports/static/<scan_id>/
#
# STAGE 5 — POLICY-AS-CODE VALIDATION (OPA / Rego / Conftest)
#   - Run Conftest with policies/terraform.rego
#   - Run Conftest with policies/aws-security.rego
#   - Capture policy violations and attach scan_id
#   - Save policy-results.json to reports/static/<scan_id>/
#
# STAGE 6 — INITIAL STATIC RISK SCORING
#   - Run scripts/risk_score.py
#   - Combine Checkov findings + OPA policy violations
#   - Classify deployment decision: ALLOW / REVIEW / BLOCK
#   - Save static-risk-score.json to reports/static/<scan_id>/
#
# STAGE 7 — AWS SANDBOX DEPLOYMENT
#   - Deploy discovered Terraform root modules to isolated AWS sandbox account
#   - Tag all deployed resources with scan_id for targeted Prowler scanning
#   - Capture deployment metadata (resources created, ARNs, timestamps)
#
# STAGE 8 — RUNTIME CLOUD SECURITY VALIDATION (Prowler)
#   - Run Prowler against sandbox resources tagged with scan_id
#   - Output Prowler findings as JSON to reports/runtime/<scan_id>/
#   - Run normalize_prowler.py to normalise runtime findings with scan_id
#
# STAGE 9 — FINAL RUNTIME-AWARE RISK SCORING
#   - Run scripts/runtime_risk_score.py
#   - Combine static findings + runtime findings
#   - Detect infrastructure drift (runtime vs static discrepancies)
#   - Adjust deployment trust score
#   - Save final reports to reports/final/<scan_id>/
#
# STAGE 10 — FORENSIC EVIDENCE PACKAGE GENERATION
#   - Run scripts/forensic_log.py
#   - Assemble all evidence: scan metadata, terraform discovery, static findings,
#     runtime findings, risk scores, deployment decision
#   - Generate evidence_id (EV-<UUID>) and SHA256 integrity hash
#   - Save forensic evidence package to evidence/<scan_id>/
#
# STAGE 11 — ARTIFACT UPLOAD & ARCHIVAL
#   - Upload reports/static/<scan_id>/ as GitHub Actions Artifact
#   - Upload reports/runtime/<scan_id>/ as GitHub Actions Artifact
#   - Upload reports/final/<scan_id>/ as GitHub Actions Artifact
#   - Upload evidence/<scan_id>/ as GitHub Actions Artifact
#   - All artifacts tagged with scan_id for retrieval
#
# =============================================================================
# PLACEHOLDER — Full workflow implementation will follow in future phases
# =============================================================================

name: IaC Security Framework Pipeline

on:
  # FUTURE: Trigger on push containing a repository URL input file
  push:
    branches:
      - main
  # Manual trigger with repository URL and branch as inputs
  workflow_dispatch:
    inputs:
      repository_url:
        description: 'GitHub repository URL to scan (e.g. https://github.com/org/repo)'
        required: true
        default: ''
      repository_branch:
        description: 'Branch to scan (defaults to main)'
        required: false
        default: 'main'

