# =============================================================================
# IaC Security Framework — Full Pipeline
#
# Accepts a GitHub repository URL, clones it, discovers Terraform directories,
# runs terraform fmt/init/validate, executes Checkov static scanning,
# normalizes findings with local severity mapping, generates combined forensic
# evidence reports, runs custom Rego policies via Conftest, enriches findings,
# calculates a pre-deployment risk score, and produces forensic-ready evidence
# at every stage.
#
# terraform-plan job: authenticates to AWS via OIDC, initialises a
# scan-isolated S3 backend, injects framework tags via TF_AWS_DEFAULT_TAGS_*,
# generates a saved Terraform plan, validates tag propagation, verifies source
# integrity, and produces deployment plan evidence.
#
# terraform-apply job (manual approval required via GitHub Environment
# 'research-aws-deployment'): downloads the exact saved plan, verifies the
# plan SHA-256, applies using the same framework tags, captures Terraform
# state, discovers and verifies deployed resources, reconciles inventories,
# generates the final deployment validation decision, and hashes all evidence.
#
# Static analysis is NON-BLOCKING — findings are preserved as evidence.
# Policy-as-Code runs in ADVISORY mode by default.
# Every step is traceable via SCAN_ID.
# =============================================================================
#
# GitHub Repository Variables required:
#   AWS_REGION          — AWS deployment region
#   AWS_ROLE_ARN        — IAM role for plan-stage OIDC auth
#   AWS_APPLY_ROLE_ARN  — IAM role for apply-stage (falls back to AWS_ROLE_ARN)
#   TF_STATE_BUCKET     — S3 bucket for Terraform backend state
#
# GitHub Environment:
#   research-aws-deployment — used to scope deployment credentials and provide
#   an optional protection layer. Required reviewers are not enforced for this
#   research scope; the environment may be configured with reviewers if desired.
# =============================================================================

name: IaC Security Framework

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

  workflow_dispatch:
    inputs:
      repo_url:
        description: "GitHub repository URL to scan"
        required: true
      branch:
        description: "Branch to scan"
        required: false
        default: "main"
      allow_research_exception:
        description: "Allow deployment of intentionally insecure IaC for controlled research"
        type: boolean
        required: true
        default: false
      research_exception_reason:
        description: "Reason for controlled research deployment (required when allow_research_exception=true)"
        required: false
        default: ""

jobs:
  security-pipeline:
    name: Security Pipeline
    runs-on: ubuntu-latest

    outputs:
      scan_id: ${{ steps.scan.outputs.scan_id }}

    steps:
      # ================================================================
      # SETUP
      # ================================================================

      - name: Checkout framework repository
        uses: actions/checkout@v4

      - name: Generate SCAN_ID
        id: scan
        run: |
          SCAN_ID="SCAN-$(uuidgen | cut -c1-8)"
          echo "SCAN_ID=$SCAN_ID" >> "$GITHUB_ENV"
          echo "scan_id=$SCAN_ID" >> "$GITHUB_OUTPUT"
          echo "Generated SCAN_ID = $SCAN_ID"

      - name: Resolve repository URL and branch
        run: |
          if [ -n "${{ github.event.inputs.repo_url }}" ]; then
            echo "REPO_URL=${{ github.event.inputs.repo_url }}" >> "$GITHUB_ENV"
          else
            echo "REPO_URL=https://github.com/${{ github.repository }}.git" >> "$GITHUB_ENV"
          fi

          if [ -n "${{ github.event.inputs.branch }}" ]; then
            echo "BRANCH=${{ github.event.inputs.branch }}" >> "$GITHUB_ENV"
          else
            REF="${GITHUB_REF##refs/heads/}"
            echo "BRANCH=${REF:-main}" >> "$GITHUB_ENV"
          fi

      - name: Print scan parameters
        run: |
          echo "========================================"
          echo "  SCAN_ID  = $SCAN_ID"
          echo "  REPO_URL = $REPO_URL"
          echo "  BRANCH   = $BRANCH"
          echo "========================================"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # ================================================================
      # INSTALL SECURITY SCANNERS
      # ================================================================

      - name: Install Checkov
        run: |
          pip install checkov
          echo "--- Checkov version ---"
          checkov --version



      - name: Install Conftest
        run: |
          CONFTEST_VERSION="0.56.0"
          wget -qO - "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" | tar xz -C /usr/local/bin conftest
          echo "--- Conftest version ---"
          conftest --version

      # ================================================================
      # STAGE 1-3: CLONE, METADATA, DISCOVERY
      # ================================================================

      - name: "Stage 1: Clone target repository"
        run: python scripts/clone_repository.py

      - name: "Stage 2: Generate scan metadata (SHA256 hashes)"
        run: python scripts/generate_scan_metadata.py

      - name: "Stage 3: Discover Terraform directories"
        run: python scripts/discover_terraform.py

      # ================================================================
      # STAGE 4: TERRAFORM VALIDATION
      # ================================================================

      - name: "Stage 4: Terraform validation (fmt / init / validate)"
        id: terraform_validation
        continue-on-error: true
        run: python scripts/terraform_validate.py

      # ================================================================
      # STAGE 5: CHECKOV SCAN (primary scanner)
      # ================================================================

      - name: "Stage 5: Checkov static security scan"
        id: checkov_scan
        if: steps.terraform_validation.outcome == 'success'
        continue-on-error: true
        run: python scripts/checkov_scan.py

      - name: "Stage 5 (skipped): Checkov scan skipped — validation failed"
        if: steps.terraform_validation.outcome != 'success'
        run: |
          echo "========================================"
          echo "  Checkov scan SKIPPED"
          echo "  Reason: Terraform validation failed"
          echo "  SCAN_ID = $SCAN_ID"
          echo "========================================"



      # ================================================================
      # STAGE 7: COMBINED EVIDENCE REPORT
      # ================================================================

      - name: "Stage 7: Generate combined static analysis report"
        if: steps.terraform_validation.outcome == 'success'
        run: python scripts/static_analysis_report.py

      # ================================================================
      # STAGE 8: PREPARE POLICY VALIDATION INPUT (non-blocking)
      # ================================================================

      - name: "Stage 8: Prepare policy validation input"
        if: steps.terraform_validation.outcome == 'success'
        run: python scripts/prepare_policy_validation_input.py
      # ================================================================
      # STAGE 9: POLICY-AS-CODE (advisory mode — findings recorded)
      # ================================================================

      - name: "Stage 9: Policy-as-Code checks (Conftest / Rego)"
        id: policy_enforcement
        if: steps.terraform_validation.outcome == 'success'
        run: python scripts/policy_runner.py
        env:
          POLICY_ENFORCEMENT_MODE: advisory
          POLICY_INPUT_MODE: source

      - name: "Stage 9 (skipped): Policy checks skipped — validation failed"
        if: steps.terraform_validation.outcome != 'success'
        run: |
          echo "  Policy checks SKIPPED — Terraform validation failed"

      # ================================================================
      # STAGE 10: UPDATE COMBINED REPORT (post-policy)
      # ================================================================

      - name: "Stage 10: Regenerate combined report with policy results"
        if: steps.terraform_validation.outcome == 'success'
        run: python scripts/static_analysis_report.py

      # ================================================================
      # STAGE 11: CONSOLE OUTPUT
      # ================================================================

      - name: "Stage 11: Print combined findings to console"
        if: steps.terraform_validation.outcome == 'success'
        run: python scripts/list_findings.py ${{ steps.scan.outputs.scan_id }}

      # ================================================================
      # STAGE 12-17: FINDING ENRICHMENT ENGINE
      # ================================================================

      - name: "Stage 12: Normalize Checkov and policy findings"
        if: steps.terraform_validation.outcome == 'success'
        run: python scripts/risk/normalize_findings.py "$SCAN_ID"

      - name: "Stage 13: AI-enrich findings"
        if: steps.terraform_validation.outcome == 'success'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-nano' }}
        run: python scripts/risk/ai_enrich_findings.py "$SCAN_ID"

      - name: "Stage 14: Validate enriched findings"
        if: steps.terraform_validation.outcome == 'success'
        run: python scripts/risk/validate_enriched_findings.py "$SCAN_ID"

      - name: "Stage 15: Render enrichment summary"
        if: steps.terraform_validation.outcome == 'success'
        run: python scripts/risk/render_enrichment_summary.py "$SCAN_ID"

      - name: "Stage 16: Hash enrichment evidence"
        if: steps.terraform_validation.outcome == 'success'
        run: python scripts/risk/hash_enrichment_evidence.py "$SCAN_ID"

      - name: "Stage 17: Advisory enrichment gate"
        if: steps.terraform_validation.outcome == 'success'
        env:
          ENFORCE_RISK_GATE: ${{ vars.ENFORCE_RISK_GATE || 'false' }}
          STRICT_RISK_GATE: ${{ vars.STRICT_RISK_GATE || 'false' }}
        run: python scripts/risk/advisory_enrichment_gate.py "$SCAN_ID"

      # ================================================================
      # STAGE 18: PRE-DEPLOYMENT RISK SCORING ENGINE
      # ================================================================

      - name: "Stage 18: Calculate pre-deployment risk score"
        if: steps.terraform_validation.outcome == 'success'
        run: python scripts/risk/calculate_predeployment_risk_score.py "$SCAN_ID"

      # ================================================================
      # STAGE 19: PRESERVE EXACT SCANNED DEPLOYMENT SOURCE
      # ================================================================

      - name: "Stage 19: Upload scanned deployment source"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-source-${{ steps.scan.outputs.scan_id }}
          path: repositories/cloned/${{ steps.scan.outputs.scan_id }}/
          retention-days: 7

      # ================================================================
      # ARTIFACT UPLOAD (always — even on failure)
      # ================================================================

      - name: Upload scan metadata artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-metadata-${{ steps.scan.outputs.scan_id }}
          path: repositories/metadata/${{ steps.scan.outputs.scan_id }}/

      - name: Upload static analysis reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-reports-${{ steps.scan.outputs.scan_id }}
          path: reports/static/${{ steps.scan.outputs.scan_id }}/

      - name: Upload policy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: policy-reports-${{ steps.scan.outputs.scan_id }}
          path: reports/policy/${{ steps.scan.outputs.scan_id }}/

      - name: Upload enrichment reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: risk-reports-${{ steps.scan.outputs.scan_id }}
          path: reports/risk/${{ steps.scan.outputs.scan_id }}/

      # ---- Future stages (not yet implemented) ----
      # - Prowler runtime validation
      # - Forensic evidence package generation

  # ====================================================================
  # TERRAFORM PLAN JOB
  #
  # Authenticates to AWS via OIDC, initialises a scan-isolated S3 backend,
  # injects SCAN_ID tags through AWS Provider environment variables
  # (TF_AWS_DEFAULT_TAGS_scan-id and TF_AWS_DEFAULT_TAGS_managed-by),
  # generates a saved Terraform plan, validates tag propagation,
  # verifies source integrity and produces deployment plan evidence.
  #
  # The target Terraform source is NEVER modified.
  # terraform apply is intentionally NOT implemented.
  # ====================================================================

  terraform-plan:
    name: Terraform Plan
    needs: security-pipeline
    runs-on: ubuntu-latest

    # Only run on push to dev (never on PRs — no AWS creds for PRs).
    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/dev'

    permissions:
      id-token: write
      contents: read

    env:
      SCAN_ID: ${{ needs.security-pipeline.outputs.scan_id }}

    steps:
      # ================================================================
      # SETUP
      # ================================================================

      - name: Checkout framework repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Print deployment parameters
        run: |
          echo "============================================================"
          echo "  TERRAFORM PLAN JOB"
          echo "============================================================"
          echo "  SCAN_ID      = $SCAN_ID"
          echo "  AWS_REGION   = ${{ vars.AWS_REGION }}"
          echo "  STATE_BUCKET = ${{ vars.TF_STATE_BUCKET }}"
          echo "  STATE_KEY    = research/$SCAN_ID/terraform.tfstate"
          echo "  TAG_MODE     = TF_AWS_DEFAULT_TAGS environment variables"
          echo "  SOURCE_MODS  = NONE (target repo unchanged)"
          echo "============================================================"

      # ================================================================
      # STAGE 19 (download): Retrieve exact scanned source + metadata
      # ================================================================

      - name: "Stage 19: Download scanned deployment source"
        uses: actions/download-artifact@v4
        with:
          name: deployment-source-${{ env.SCAN_ID }}
          path: deployment-source/

      - name: Download scan metadata
        uses: actions/download-artifact@v4
        with:
          name: scan-metadata-${{ env.SCAN_ID }}
          path: repositories/metadata/${{ env.SCAN_ID }}/

      # ================================================================
      # STAGE 20: AWS OIDC AUTHENTICATION
      # ================================================================

      - name: "Stage 20: Authenticate to AWS via OIDC"
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: terraform-plan-${{ env.SCAN_ID }}

      - name: "Stage 20: Verify AWS identity"
        id: aws_identity
        run: |
          echo "Verifying AWS OIDC authentication..."
          AWS_IDENTITY=$(aws sts get-caller-identity --output json)
          echo "$AWS_IDENTITY"
          # Compact to single line — GITHUB_OUTPUT does not support multi-line values
          AWS_IDENTITY_COMPACT=$(echo "$AWS_IDENTITY" | jq -c '.')
          echo "aws_identity=$AWS_IDENTITY_COMPACT" >> "$GITHUB_OUTPUT"
          echo "AWS authentication verified."

      # ================================================================
      # STAGE 21a: DEPLOYMENT CONTRACT VALIDATION
      # Checks: single root, resolvable path, .tf files, AWS provider.
      # Does NOT require scan_id variable or default_tags in target repo.
      # ================================================================

      - name: "Stage 21a: Validate deployment contract"
        id: deployment_contract
        run: python scripts/deployment/validate_deployment_contract.py "$SCAN_ID"

      # ================================================================
      # STAGE 21b: SOURCE INTEGRITY BASELINE (before init/plan)
      # ================================================================

      - name: "Stage 21b: Save source integrity baseline"
        run: |
          python scripts/deployment/validate_source_integrity.py \
            "$SCAN_ID" \
            "${{ steps.deployment_contract.outputs.deployment_root }}" \
            --save

      # ================================================================
      # STAGE 21c: TERRAFORM INIT WITH SCAN-ISOLATED S3 BACKEND
      # ================================================================

      - name: "Stage 21c: Terraform init with scan-isolated S3 backend"
        working-directory: ${{ steps.deployment_contract.outputs.deployment_root }}
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=research/${SCAN_ID}/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      # ================================================================
      # STAGE 21d: VALIDATE AWS PROVIDER VERSION
      # Requires AWS provider >= 5.62.0 for TF_AWS_DEFAULT_TAGS support.
      # ================================================================

      - name: "Stage 21d: Validate AWS provider version"
        run: |
          python scripts/deployment/validate_aws_provider_version.py \
            "$SCAN_ID" \
            "${{ steps.deployment_contract.outputs.deployment_root }}"

      # ================================================================
      # STAGE 22: TERRAFORM PLAN WITH FRAMEWORK TAG INJECTION
      #
      # Tags are injected using AWS Provider environment variables.
      # The `env` command is required because TF_AWS_DEFAULT_TAGS_scan-id
      # contains a hyphen which is invalid in normal shell variable names.
      #
      # The target Terraform source is NOT modified.
      # No _override.tf or generated provider blocks are created.
      # ================================================================

      - name: "Stage 22: Terraform plan with framework tag injection"
        id: tf_plan
        working-directory: ${{ steps.deployment_contract.outputs.deployment_root }}
        run: |
          echo "============================================================"
          echo "  TERRAFORM PLAN WITH FRAMEWORK TAG INJECTION"
          echo "============================================================"
          echo "  SCAN_ID     : ${SCAN_ID}"
          echo "  scan-id     : ${SCAN_ID}"
          echo "  managed-by  : iac-security-framework"
          echo "============================================================"

          env \
            "TF_AWS_DEFAULT_TAGS_scan-id=${SCAN_ID}" \
            "TF_AWS_DEFAULT_TAGS_managed-by=iac-security-framework" \
            terraform plan \
              -input=false \
              -out=tfplan

      - name: "Stage 22: Generate human-readable plan"
        working-directory: ${{ steps.deployment_contract.outputs.deployment_root }}
        run: terraform show -no-color tfplan > terraform-plan.txt

      - name: "Stage 22: Generate JSON plan"
        working-directory: ${{ steps.deployment_contract.outputs.deployment_root }}
        run: terraform show -json tfplan > terraform-plan.json

      - name: "Stage 22: Copy plan evidence to reports"
        id: plan_evidence
        run: |
          DEPLOY_DIR="reports/deployment/$SCAN_ID"
          mkdir -p "$DEPLOY_DIR"
          TF_ROOT="${{ steps.deployment_contract.outputs.deployment_root }}"
          cp "$TF_ROOT/terraform-plan.txt" "$DEPLOY_DIR/terraform-plan.txt"
          cp "$TF_ROOT/terraform-plan.json" "$DEPLOY_DIR/terraform-plan.json"
          PLAN_SHA=$(sha256sum "$TF_ROOT/tfplan" | cut -d' ' -f1)
          echo "$PLAN_SHA" > "$DEPLOY_DIR/terraform-plan.sha256"
          echo "plan_sha256=$PLAN_SHA" >> "$GITHUB_OUTPUT"
          echo "Plan SHA256: $PLAN_SHA"

      # ================================================================
      # STAGE 22e: SOURCE INTEGRITY VERIFICATION (after plan)
      # Confirms no .tf source files were modified during init or plan.
      # ================================================================

      - name: "Stage 22e: Verify source integrity after plan"
        run: |
          python scripts/deployment/validate_source_integrity.py \
            "$SCAN_ID" \
            "${{ steps.deployment_contract.outputs.deployment_root }}" \
            --verify

      # ================================================================
      # STAGE 23: VALIDATE SCAN_ID RESOURCE TAGS IN PLAN
      # Strict validation — unknown/incorrect tag values are failures.
      # ================================================================

      - name: "Stage 23: Validate framework tags in plan"
        id: tag_validation
        run: |
          python scripts/deployment/validate_plan_tags.py \
            "$SCAN_ID" \
            "${{ steps.deployment_contract.outputs.deployment_root }}/terraform-plan.json"

      # ================================================================
      # STAGE 24: GENERATE DEPLOYMENT PLAN EVIDENCE
      # ================================================================

      - name: "Stage 24a: Capture Terraform and provider versions"
        id: versions
        run: |
          TF_VER=$(terraform version -json | python3 -c "import sys,json; print(json.load(sys.stdin)['terraform_version'])")
          echo "tf_version=$TF_VER" >> "$GITHUB_OUTPUT"

          AWS_PROV_VER=$(python3 -c "
          import json, sys
          data = json.load(open('reports/deployment/${{ env.SCAN_ID }}/aws-provider-validation.json'))
          print(data.get('selected_version', 'unknown'))
          ")
          echo "aws_provider_version=$AWS_PROV_VER" >> "$GITHUB_OUTPUT"

          TAG_STATUS=$(python3 -c "
          import json, sys
          data = json.load(open('reports/deployment/${{ env.SCAN_ID }}/tag-validation.json'))
          print(data.get('status', 'UNKNOWN'))
          " 2>/dev/null || echo "UNKNOWN")
          echo "tag_validation_status=$TAG_STATUS" >> "$GITHUB_OUTPUT"

          TAGGABLE=$(python3 -c "
          import json
          data = json.load(open('reports/deployment/${{ env.SCAN_ID }}/tag-validation.json'))
          print(data.get('taggable_resources_checked', 0))
          " 2>/dev/null || echo "0")
          echo "taggable_checked=$TAGGABLE" >> "$GITHUB_OUTPUT"

          RES_FAILED=$(python3 -c "
          import json
          data = json.load(open('reports/deployment/${{ env.SCAN_ID }}/tag-validation.json'))
          print(data.get('resources_failed', 0))
          " 2>/dev/null || echo "0")
          echo "resources_failed=$RES_FAILED" >> "$GITHUB_OUTPUT"

          INTEGRITY_STATUS=$(python3 -c "
          import json
          data = json.load(open('reports/deployment/${{ env.SCAN_ID }}/deployment-source-integrity.json'))
          print(data.get('status', 'UNKNOWN'))
          " 2>/dev/null || echo "UNKNOWN")
          echo "source_integrity_status=$INTEGRITY_STATUS" >> "$GITHUB_OUTPUT"

      - name: "Stage 24b: Generate deployment plan evidence"
        run: |
          python scripts/deployment/generate_deployment_evidence.py "$SCAN_ID" \
            --deployment-root "${{ steps.deployment_contract.outputs.deployment_root }}" \
            --plan-exit-code 0 \
            --plan-sha256 "${{ steps.plan_evidence.outputs.plan_sha256 }}" \
            --tag-validation-status "${{ steps.versions.outputs.tag_validation_status }}" \
            --source-integrity-status "${{ steps.versions.outputs.source_integrity_status }}" \
            --aws-provider-version "${{ steps.versions.outputs.aws_provider_version }}" \
            --aws-identity-json '${{ steps.aws_identity.outputs.aws_identity }}' \
            --terraform-version "${{ steps.versions.outputs.tf_version }}" \
            --state-bucket "${{ vars.TF_STATE_BUCKET }}" \
            --state-key "research/$SCAN_ID/terraform.tfstate" \
            --taggable-checked "${{ steps.versions.outputs.taggable_checked }}" \
            --resources-failed "${{ steps.versions.outputs.resources_failed }}"

      - name: "Stage 24c: Hash deployment evidence"
        run: |
          python scripts/deployment/hash_deployment_evidence.py "$SCAN_ID" \
            --plan-dir "${{ steps.deployment_contract.outputs.deployment_root }}"

      # ================================================================
      # ARTIFACT UPLOAD (always — preserve failure evidence too)
      # ================================================================

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ env.SCAN_ID }}
          retention-days: 7
          path: |
            ${{ steps.deployment_contract.outputs.deployment_root }}/tfplan
            reports/deployment/${{ env.SCAN_ID }}/


  # ====================================================================
  # TERRAFORM APPLY JOB — CONTROLLED DEPLOYMENT
  #
  # Uses GitHub Environment 'research-aws-deployment' to scope deployment
  # credentials. Required reviewers are optional for this research scope.
  # To add a reviewer gate, configure it in:
  #   Repository Settings → Environments → research-aws-deployment
  #
  # Stages:
  #   25. Download and verify exact saved plan artifact
  #   26. Re-authenticate to AWS via OIDC (fresh credentials per job)
  #   27. Validate deployment authorization
  #   28. Reinitialize Terraform with same S3 backend
  #   29. Apply exact saved plan with framework tag injection
  #   30. Capture and sanitize Terraform state
  #   31. Discover tagged AWS resources
  #   32. Verify deployed resources via service APIs
  #   33. Generate final deployment validation decision
  #   34. Render deployment summary
  #   35. Hash all apply and validation evidence
  #   36. Upload deployment evidence artifacts
  #
  # terraform apply is implemented ONLY in this job.
  # The exact saved tfplan from terraform-plan is used — never a new plan.
  # ====================================================================

  terraform-apply:
    name: Controlled Terraform Apply
    needs:
      - security-pipeline
      - terraform-plan
    runs-on: ubuntu-latest

    # Only on push/dispatch to dev — never on PRs.
    if: >
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/dev'

    # GitHub Environment scopes deployment credentials.
    # Required reviewers are optional — configure them in the GitHub UI if needed.
    environment:
      name: research-aws-deployment

    permissions:
      id-token: write
      contents: read
      actions: read

    env:
      SCAN_ID: ${{ needs.security-pipeline.outputs.scan_id }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      RESEARCH_EXCEPTION: ${{ github.event.inputs.allow_research_exception || 'false' }}
      RESEARCH_REASON: ${{ github.event.inputs.research_exception_reason || '' }}

    steps:
      # ================================================================
      # SETUP
      # ================================================================

      - name: Checkout framework repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Print apply parameters
        run: |
          echo "============================================================"
          echo "  CONTROLLED TERRAFORM APPLY JOB"
          echo "============================================================"
          echo "  SCAN_ID           = $SCAN_ID"
          echo "  AWS_REGION        = $AWS_REGION"
          echo "  STATE_BUCKET      = $TF_STATE_BUCKET"
          echo "  STATE_KEY         = research/$SCAN_ID/terraform.tfstate"
          echo "  PLAN_ARTIFACT     = terraform-plan-$SCAN_ID"
          echo "  ENVIRONMENT       = research-aws-deployment"
          echo "  RESEARCH_EXCEPTION= $RESEARCH_EXCEPTION"
          echo "============================================================"

      # ================================================================
      # STAGE 25: DOWNLOAD AND VERIFY EXACT SAVED PLAN ARTIFACT
      # ================================================================

      - name: "Stage 25: Download scanned deployment source"
        uses: actions/download-artifact@v4
        with:
          name: deployment-source-${{ env.SCAN_ID }}
          path: deployment-source/

      - name: "Stage 25: Download scan metadata"
        uses: actions/download-artifact@v4
        with:
          name: scan-metadata-${{ env.SCAN_ID }}
          path: repositories/metadata/${{ env.SCAN_ID }}/

      - name: "Stage 25: Download risk reports"
        uses: actions/download-artifact@v4
        with:
          name: risk-reports-${{ env.SCAN_ID }}
          path: reports/risk/${{ env.SCAN_ID }}/
        continue-on-error: true

      - name: "Stage 25: Download Terraform plan artifact"
        uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ env.SCAN_ID }}
          path: plan-artifact/

      - name: "Stage 25: Locate and stage plan files"
        id: stage_plan
        run: |
          # The artifact may contain: tfplan, reports/deployment/<SCAN_ID>/*
          # Find tfplan robustly
          TFPLAN=$(find plan-artifact -name "tfplan" -type f | head -1)
          SHA256_FILE=$(find plan-artifact -name "terraform-plan.sha256" -type f | head -1)
          EVIDENCE_FILE=$(find plan-artifact -name "deployment-plan-evidence.json" -type f | head -1)

          echo "Found tfplan       : $TFPLAN"
          echo "Found sha256       : $SHA256_FILE"
          echo "Found evidence     : $EVIDENCE_FILE"

          echo "tfplan_path=$TFPLAN" >> "$GITHUB_OUTPUT"
          echo "sha256_path=$SHA256_FILE" >> "$GITHUB_OUTPUT"
          echo "evidence_path=$EVIDENCE_FILE" >> "$GITHUB_OUTPUT"

          # Restore plan evidence reports
          PLAN_REPORTS=$(find plan-artifact -path "*/deployment/$SCAN_ID" -type d | head -1)
          if [ -n "$PLAN_REPORTS" ]; then
            mkdir -p "reports/deployment/$SCAN_ID"
            cp -r "$PLAN_REPORTS/"* "reports/deployment/$SCAN_ID/" 2>/dev/null || true
          fi

      - name: "Stage 25: Verify plan artifact integrity"
        run: |
          python scripts/deployment/verify_plan_artifact.py \
            "$SCAN_ID" \
            "${{ steps.stage_plan.outputs.tfplan_path }}" \
            "${{ steps.stage_plan.outputs.sha256_path }}" \
            "${{ steps.stage_plan.outputs.evidence_path }}"

      # ================================================================
      # STAGE 26: RE-AUTHENTICATE TO AWS VIA OIDC
      # Each job runs on a separate runner — credentials do not transfer.
      # Support AWS_APPLY_ROLE_ARN for least-privilege apply role;
      # fall back to AWS_ROLE_ARN when not configured.
      # ================================================================

      - name: "Stage 26: Authenticate to AWS via OIDC"
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: terraform-apply-${{ env.SCAN_ID }}

      - name: "Stage 26: Verify AWS identity and account match"
        id: aws_identity
        run: |
          echo "Verifying AWS OIDC authentication for apply..."
          AWS_IDENTITY=$(aws sts get-caller-identity --output json)
          AWS_IDENTITY_COMPACT=$(echo "$AWS_IDENTITY" | jq -c '.')
          echo "aws_identity=$AWS_IDENTITY_COMPACT" >> "$GITHUB_OUTPUT"

          APPLY_ACCOUNT=$(echo "$AWS_IDENTITY" | jq -r '.Account')
          echo "apply_account=$APPLY_ACCOUNT" >> "$GITHUB_OUTPUT"
          echo "Apply job AWS Account: $APPLY_ACCOUNT"

          # Compare with plan-stage account from evidence
          EVIDENCE_FILE="${{ steps.stage_plan.outputs.evidence_path }}"
          if [ -z "$EVIDENCE_FILE" ]; then
            EVIDENCE_FILE="reports/deployment/$SCAN_ID/deployment-plan-evidence.json"
          fi
          PLAN_ACCOUNT=$(python3 -c "
          import json, sys
          try:
            data = json.load(open('$EVIDENCE_FILE'))
            print(data.get('aws', {}).get('account_id', ''))
          except Exception:
            print('')
          " 2>/dev/null || echo "")

          if [ -n "$PLAN_ACCOUNT" ] && [ "$APPLY_ACCOUNT" != "$PLAN_ACCOUNT" ]; then
            echo "ERROR: AWS account mismatch!"
            echo "  Plan account  : $PLAN_ACCOUNT"
            echo "  Apply account : $APPLY_ACCOUNT"
            # Generate identity validation report showing failure
            mkdir -p reports/deployment/$SCAN_ID
            python3 -c "
          import json
          from datetime import datetime, timezone
          result = {
            'schema_version': '1.0',
            'scan_id': '$SCAN_ID',
            'generated_at_utc': datetime.now(timezone.utc).isoformat(),
            'status': 'FAIL',
            'apply_account_id': '$APPLY_ACCOUNT',
            'plan_account_id': '$PLAN_ACCOUNT',
            'account_match': False,
            'error': 'AWS_ACCOUNT_MISMATCH',
          }
          json.dump(result, open('reports/deployment/$SCAN_ID/apply-aws-identity-validation.json', 'w'), indent=2)
          "
            exit 1
          fi

          # Generate identity validation report
          python3 -c "
          import json
          from datetime import datetime, timezone
          import os
          identity = $AWS_IDENTITY_COMPACT
          result = {
            'schema_version': '1.0',
            'scan_id': '$SCAN_ID',
            'generated_at_utc': datetime.now(timezone.utc).isoformat(),
            'status': 'PASS',
            'apply_account_id': identity.get('Account'),
            'plan_account_id': identity.get('Account'),
            'assumed_role_arn': identity.get('Arn'),
            'user_id': identity.get('UserId'),
            'account_match': True,
            'region': os.environ.get('AWS_REGION', ''),
          }
          import os; os.makedirs('reports/deployment/$SCAN_ID', exist_ok=True)
          json.dump(result, open('reports/deployment/$SCAN_ID/apply-aws-identity-validation.json', 'w'), indent=2)
          "
          echo "AWS identity verified. Account: $APPLY_ACCOUNT"

      # ================================================================
      # STAGE 27: VALIDATE DEPLOYMENT AUTHORIZATION
      # ================================================================

      - name: "Stage 27: Validate deployment authorization"
        run: |
          AUTH_TYPE="STANDARD_APPROVAL"
          REASON_ARG=""
          if [ "$RESEARCH_EXCEPTION" = "true" ]; then
            AUTH_TYPE="RESEARCH_EXCEPTION"
            REASON_ARG="--research-exception-reason \"$RESEARCH_REASON\""
          fi

          python scripts/deployment/validate_apply_authorization.py "$SCAN_ID" \
            --authorization-type "$AUTH_TYPE" \
            --research-exception-reason "$RESEARCH_REASON" \
            --github-actor "$GITHUB_ACTOR" \
            --github-run-id "$GITHUB_RUN_ID" \
            --github-run-attempt "$GITHUB_RUN_ATTEMPT"

      # ================================================================
      # STAGE 28: REINITIALIZE TERRAFORM WITH SAME S3 BACKEND
      # ================================================================

      - name: "Stage 28: Resolve deployment contract"
        id: deployment_contract
        run: python scripts/deployment/validate_deployment_contract.py "$SCAN_ID"

      - name: "Stage 28: Source integrity pre-apply check"
        run: |
          python scripts/deployment/validate_source_integrity.py \
            "$SCAN_ID" \
            "${{ steps.deployment_contract.outputs.deployment_root }}" \
            --save

      - name: "Stage 28: Terraform init — same S3 backend"
        working-directory: ${{ steps.deployment_contract.outputs.deployment_root }}
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=research/${SCAN_ID}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"

      - name: "Stage 28: Validate AWS provider version"
        run: |
          python scripts/deployment/validate_aws_provider_version.py \
            "$SCAN_ID" \
            "${{ steps.deployment_contract.outputs.deployment_root }}"

      - name: "Stage 28: Verify source integrity before apply"
        run: |
          python scripts/deployment/validate_source_integrity.py \
            "$SCAN_ID" \
            "${{ steps.deployment_contract.outputs.deployment_root }}" \
            --verify

      - name: "Stage 28: Restore tfplan to deployment root"
        run: |
          TFPLAN_SRC="${{ steps.stage_plan.outputs.tfplan_path }}"
          DEPLOY_ROOT="${{ steps.deployment_contract.outputs.deployment_root }}"
          if [ -f "$TFPLAN_SRC" ]; then
            cp "$TFPLAN_SRC" "$DEPLOY_ROOT/tfplan"
            echo "Restored tfplan to $DEPLOY_ROOT/tfplan"
          else
            echo "ERROR: tfplan not found at $TFPLAN_SRC"
            exit 1
          fi

      # ================================================================
      # STAGE 29: APPLY EXACT SAVED PLAN WITH FRAMEWORK TAG INJECTION
      # Uses the same TF_AWS_DEFAULT_TAGS_* env vars as the plan stage.
      # ================================================================

      - name: "Stage 29: Terraform apply — exact saved plan"
        id: tf_apply
        working-directory: ${{ steps.deployment_contract.outputs.deployment_root }}
        run: |
          echo "============================================================"
          echo "  TERRAFORM APPLY — EXACT SAVED PLAN"
          echo "============================================================"
          echo "  SCAN_ID     : ${SCAN_ID}"
          echo "  scan-id     : ${SCAN_ID} (injected via TF_AWS_DEFAULT_TAGS)"
          echo "  managed-by  : iac-security-framework"
          echo "  Plan SHA    : $(cat '${SCAN_ID}.tfplan.sha256' 2>/dev/null || echo N/A)"
          echo "============================================================"

          APPLY_START=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "apply_start_time=$APPLY_START" >> "$GITHUB_OUTPUT"

          APPLY_OUTPUT="/tmp/terraform-apply-output.txt"

          set -o pipefail
          env \
            "TF_AWS_DEFAULT_TAGS_scan-id=${SCAN_ID}" \
            "TF_AWS_DEFAULT_TAGS_managed-by=iac-security-framework" \
            terraform apply \
              -input=false \
              -auto-approve \
              tfplan 2>&1 | tee "$APPLY_OUTPUT"
          APPLY_EXIT_CODE=${PIPESTATUS[0]}

          APPLY_FINISH=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "apply_finish_time=$APPLY_FINISH" >> "$GITHUB_OUTPUT"
          echo "apply_exit_code=$APPLY_EXIT_CODE" >> "$GITHUB_OUTPUT"

          # Always copy output to reports
          mkdir -p "${GITHUB_WORKSPACE}/reports/deployment/${SCAN_ID}"
          cp "$APPLY_OUTPUT" "${GITHUB_WORKSPACE}/reports/deployment/${SCAN_ID}/terraform-apply.txt"

          exit $APPLY_EXIT_CODE

      - name: "Stage 29: Generate apply evidence"
        if: always()
        id: tf_versions_apply
        run: |
          TF_VER=$(terraform version -json | python3 -c "import sys,json; print(json.load(sys.stdin)['terraform_version'])")
          AWS_PROV_VER=$(python3 -c "
          import json
          data = json.load(open('reports/deployment/${{ env.SCAN_ID }}/aws-provider-validation.json'))
          print(data.get('selected_version', 'unknown'))
          " 2>/dev/null || echo "unknown")

          AUTH_TYPE=$(python3 -c "
          import json
          data = json.load(open('reports/deployment/${{ env.SCAN_ID }}/deployment-authorization.json'))
          print(data.get('authorization_type', 'STANDARD_APPROVAL'))
          " 2>/dev/null || echo "STANDARD_APPROVAL")

          python scripts/deployment/generate_apply_evidence.py "$SCAN_ID" \
            --apply-exit-code "${{ steps.tf_apply.outputs.apply_exit_code || '1' }}" \
            --plan-sha256 "$(cat '${{ steps.stage_plan.outputs.sha256_path }}' 2>/dev/null | head -1)" \
            --terraform-version "$TF_VER" \
            --aws-provider-version "$AWS_PROV_VER" \
            --aws-identity-json '${{ steps.aws_identity.outputs.aws_identity }}' \
            --state-bucket "$TF_STATE_BUCKET" \
            --state-key "research/$SCAN_ID/terraform.tfstate" \
            --deployment-root "${{ steps.deployment_contract.outputs.deployment_root }}" \
            --apply-start-time "${{ steps.tf_apply.outputs.apply_start_time }}" \
            --apply-finish-time "${{ steps.tf_apply.outputs.apply_finish_time }}" \
            --authorization-type "$AUTH_TYPE" \
            --apply-output-path "reports/deployment/$SCAN_ID/terraform-apply.txt"

      # ================================================================
      # STAGE 30: CAPTURE TERRAFORM STATE (sensitive — short retention)
      # ================================================================

      - name: "Stage 30: Capture Terraform state evidence"
        if: steps.tf_apply.outputs.apply_exit_code == '0'
        working-directory: ${{ steps.deployment_contract.outputs.deployment_root }}
        run: |
          DEPLOY_DIR="${GITHUB_WORKSPACE}/reports/deployment/${SCAN_ID}"
          mkdir -p "$DEPLOY_DIR"

          echo "Pulling Terraform state..."
          terraform state pull > "$DEPLOY_DIR/terraform-state-pull.json"
          sha256sum "$DEPLOY_DIR/terraform-state-pull.json" | cut -d' ' -f1 > "$DEPLOY_DIR/terraform-state.sha256"

          echo "Building state address list..."
          terraform state list > "$DEPLOY_DIR/terraform-state-addresses.txt" 2>/dev/null || true

          echo "Building state show JSON..."
          terraform show -json > "$DEPLOY_DIR/deployed-state.json"

          echo "Capturing outputs..."
          terraform output -json > "$DEPLOY_DIR/terraform-outputs.json" 2>/dev/null || echo "{}" > "$DEPLOY_DIR/terraform-outputs.json"

          echo "State captured:"
          wc -l "$DEPLOY_DIR/terraform-state-addresses.txt"

      - name: "Stage 30: Build Terraform state resource inventory"
        if: steps.tf_apply.outputs.apply_exit_code == '0'
        run: |
          python scripts/deployment/build_state_resource_inventory.py \
            "$SCAN_ID" \
            "reports/deployment/$SCAN_ID/deployed-state.json"
          
      - name: "Stage 30.5: Verify deployment tags"
        if: steps.tf_apply.outputs.apply_exit_code == '0'
        run: |
          python scripts/deployment/verify_deployment_tags.py \
            "$SCAN_ID" \
            "reports/deployment/$SCAN_ID/terraform-state-resource-inventory.json"
          
          echo "Diagnostic: Inventory summary"
          python - <<'PY'
          import json
          from pathlib import Path
          import os

          scan_id = os.environ["SCAN_ID"]
          path = Path(f"reports/deployment/{scan_id}/terraform-state-resource-inventory.json")
          if path.exists():
              data = json.loads(path.read_text())
              print("Inventory summary:", data.get("summary"))
              print("Resource count:", len(data.get("resources", [])))
              for resource in data.get("resources", []):
                  print(
                      resource.get("terraform_address"),
                      resource.get("resource_id"),
                      resource.get("resource_arn"),
                      resource.get("aws_service"),
                      resource.get("aws_region"),
                  )
          else:
              print("Diagnostic: Inventory file not found.")
          PY

      # ================================================================
      # STAGE 31: DISCOVER TAGGED AWS RESOURCES
      # ================================================================

      - name: "Stage 31: Discover AWS resources by framework tags"
        if: steps.tf_apply.outputs.apply_exit_code == '0'
        run: |
          python scripts/deployment/discover_tagged_aws_resources.py \
            "$SCAN_ID" \
            --region "$AWS_REGION"

      # ================================================================
      # STAGE 32: RECONCILE AND VERIFY DEPLOYED RESOURCES
      # ================================================================

      - name: "Stage 32: Reconcile state and tag-discovery inventories"
        if: steps.tf_apply.outputs.apply_exit_code == '0'
        run: |
          python scripts/deployment/reconcile_resource_inventories.py \
            "$SCAN_ID" \
            "reports/deployment/$SCAN_ID/terraform-state-resource-inventory.json" \
            "reports/deployment/$SCAN_ID/tagged-aws-resource-inventory.json"

      - name: "Stage 32: Verify deployed resources via service APIs"
        if: steps.tf_apply.outputs.apply_exit_code == '0'
        run: |
          python scripts/deployment/verify_deployed_resources.py \
            "$SCAN_ID" \
            "reports/deployment/$SCAN_ID/terraform-state-resource-inventory.json" \
            --region "$AWS_REGION"

      # ================================================================
      # STAGE 33: GENERATE DEPLOYMENT VALIDATION DECISION
      # ================================================================

      - name: "Stage 33: Generate deployment validation decision"
        if: steps.tf_apply.outputs.apply_exit_code == '0'
        run: |
          python scripts/deployment/generate_deployment_validation.py "$SCAN_ID"

      # ================================================================
      # STAGE 34: DEPLOYMENT SUMMARY
      # ================================================================

      - name: "Stage 34: Render deployment summary"
        if: always()
        run: python scripts/deployment/render_deployment_summary.py "$SCAN_ID"

      # ================================================================
      # STAGE 35: HASH ALL EVIDENCE
      # ================================================================

      - name: "Stage 35: Hash all deployment and validation evidence"
        if: always()
        run: python scripts/deployment/hash_apply_evidence.py "$SCAN_ID"

      # ================================================================
      # STAGE 36: UPLOAD EVIDENCE ARTIFACTS
      # Sensitive state data uploaded with shorter retention period.
      # ================================================================

      - name: "Stage 36: Upload deployment evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-deployment-${{ env.SCAN_ID }}
          retention-days: 30
          path: |
            reports/deployment/${{ env.SCAN_ID }}/plan-artifact-verification.json
            reports/deployment/${{ env.SCAN_ID }}/apply-aws-identity-validation.json
            reports/deployment/${{ env.SCAN_ID }}/deployment-authorization.json
            reports/deployment/${{ env.SCAN_ID }}/terraform-apply.txt
            reports/deployment/${{ env.SCAN_ID }}/deployment-apply-evidence.json
            reports/deployment/${{ env.SCAN_ID }}/terraform-state-resource-inventory.json
            reports/deployment/${{ env.SCAN_ID }}/tagged-aws-resource-inventory.json
            reports/deployment/${{ env.SCAN_ID }}/deployment-resource-reconciliation.json
            reports/deployment/${{ env.SCAN_ID }}/deployed-resource-verification.json
            reports/deployment/${{ env.SCAN_ID }}/deployment-validation.json
            reports/deployment/${{ env.SCAN_ID }}/deployment-apply-evidence-manifest.json

      - name: "Stage 36: Upload sensitive state evidence (short retention)"
        if: steps.tf_apply.outputs.apply_exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-sensitive-state-${{ env.SCAN_ID }}
          retention-days: 7
          path: |
            reports/deployment/${{ env.SCAN_ID }}/terraform-state-pull.json
            reports/deployment/${{ env.SCAN_ID }}/terraform-state.sha256
            reports/deployment/${{ env.SCAN_ID }}/deployed-state.json
            reports/deployment/${{ env.SCAN_ID }}/terraform-outputs.json
            reports/deployment/${{ env.SCAN_ID }}/terraform-state-addresses.txt

      # ================================================================
      # RUNTIME SECURITY VALIDATION (Phase 3)
      # Runs only if Terraform Apply was successful.
      # ================================================================

      - name: "Stage 37: Build deployment resource manifest"
        if: steps.tf_apply.outputs.apply_exit_code == '0'
        run: python scripts/runtime/build_deployment_manifest.py "$SCAN_ID"

      - name: "Stage 38: Install and Verify Prowler"
        if: steps.tf_apply.outputs.apply_exit_code == '0'
        run: |
          pip install "prowler==4.3.4"
          echo "Verifying Prowler installation..."
          prowler -v
          
          echo "Verifying boto versions..."
          python - <<'PY'
          import boto3
          import botocore
          print("boto3:", boto3.__version__)
          print("botocore:", botocore.__version__)
          PY
          
          echo "Verifying Prowler AWS module..."
          prowler aws --help > /dev/null
          echo "Prowler is installed and functioning correctly."

      - name: "Stage 39: Run Prowler scan"
        if: steps.tf_apply.outputs.apply_exit_code == '0'
        run: python scripts/runtime/run_prowler.py "$SCAN_ID"

      - name: "Stage 40: Normalize runtime findings"
        if: steps.tf_apply.outputs.apply_exit_code == '0'
        run: python scripts/runtime/normalize_runtime_findings.py "$SCAN_ID"

      - name: "Stage 41: List runtime findings"
        if: always() && steps.tf_apply.outputs.apply_exit_code == '0'
        run: python scripts/runtime/list_runtime_findings.py "$SCAN_ID"

      - name: "Stage 42: Hash runtime evidence"
        if: always() && steps.tf_apply.outputs.apply_exit_code == '0'
        run: python scripts/runtime/generate_runtime_evidence.py "$SCAN_ID"

      - name: "Stage 43: Upload runtime evidence artifacts"
        if: always() && steps.tf_apply.outputs.apply_exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-runtime-${{ env.SCAN_ID }}
          retention-days: 30
          path: reports/runtime/${{ env.SCAN_ID }}/
