# =============================================================================
# IaC Security Framework — Terraform Validation Pipeline
#
# Accepts a GitHub repository URL, clones it, discovers Terraform directories,
# runs terraform fmt/init/validate, and uploads forensic metadata as artifacts.
#
# Every step is traceable via SCAN_ID.
# =============================================================================

name: IaC Security Framework

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      repo_url:
        description: "GitHub repository URL to scan"
        required: true
      branch:
        description: "Branch to scan"
        required: false
        default: "main"

jobs:
  terraform-validation:
    name: Terraform Validation Pipeline
    runs-on: ubuntu-latest

    steps:
      # ---- Setup ----
      - name: Checkout framework repository
        uses: actions/checkout@v4

      - name: Generate SCAN_ID
        id: scan
        run: |
          SCAN_ID="SCAN-$(uuidgen | cut -c1-8)"
          echo "SCAN_ID=$SCAN_ID" >> "$GITHUB_ENV"
          echo "scan_id=$SCAN_ID" >> "$GITHUB_OUTPUT"
          echo "Generated SCAN_ID = $SCAN_ID"

      - name: Resolve repository URL and branch
        run: |
          # For workflow_dispatch: use provided inputs
          # For push/pull_request: default to the current repository
          if [ -n "${{ github.event.inputs.repo_url }}" ]; then
            echo "REPO_URL=${{ github.event.inputs.repo_url }}" >> "$GITHUB_ENV"
          else
            echo "REPO_URL=https://github.com/${{ github.repository }}.git" >> "$GITHUB_ENV"
          fi

          if [ -n "${{ github.event.inputs.branch }}" ]; then
            echo "BRANCH=${{ github.event.inputs.branch }}" >> "$GITHUB_ENV"
          else
            REF="${GITHUB_REF##refs/heads/}"
            echo "BRANCH=${REF:-main}" >> "$GITHUB_ENV"
          fi

      - name: Print scan parameters
        run: |
          echo "========================================"
          echo "  SCAN_ID  = $SCAN_ID"
          echo "  REPO_URL = $REPO_URL"
          echo "  BRANCH   = $BRANCH"
          echo "========================================"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # ---- Pipeline stages ----
      - name: "Stage 1: Clone target repository"
        run: python scripts/clone_repository.py

      - name: "Stage 2: Generate scan metadata (SHA256 hashes)"
        run: python scripts/generate_scan_metadata.py

      - name: "Stage 3: Discover Terraform directories"
        run: python scripts/discover_terraform.py

      - name: "Stage 4: Terraform validation (fmt / init / validate)"
        run: python scripts/terraform_validate.py

      # ---- Artifacts (always upload, even on failure) ----
      - name: Upload scan metadata artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-metadata-${{ steps.scan.outputs.scan_id }}
          path: repositories/metadata/${{ steps.scan.outputs.scan_id }}/

      - name: Upload validation report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-validation-${{ steps.scan.outputs.scan_id }}
          path: reports/static/${{ steps.scan.outputs.scan_id }}/

      # ---- Future stages (not yet implemented) ----
      # - Checkov static scanning
      # - OPA/Rego policy validation
      # - Risk scoring
      # - AWS sandbox deployment
      # - Prowler runtime validation
      # - Forensic evidence package generation
