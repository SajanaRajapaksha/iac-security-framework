# =============================================================================
# IaC Security Framework — Terraform Validation + Checkov Scanning Pipeline
#
# Accepts a GitHub repository URL, clones it, discovers Terraform directories,
# runs terraform fmt/init/validate, executes Checkov static security scanning,
# normalizes findings, generates forensic summaries, and uploads all reports
# as GitHub Actions artifacts.
#
# Every step is traceable via SCAN_ID.
# =============================================================================

name: IaC Security Framework

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      repo_url:
        description: "GitHub repository URL to scan"
        required: true
      branch:
        description: "Branch to scan"
        required: false
        default: "main"

jobs:
  terraform-validation:
    name: Terraform Validation + Checkov Scanning Pipeline
    runs-on: ubuntu-latest

    steps:
      # ---- Setup ----
      - name: Checkout framework repository
        uses: actions/checkout@v4

      - name: Generate SCAN_ID
        id: scan
        run: |
          SCAN_ID="SCAN-$(uuidgen | cut -c1-8)"
          echo "SCAN_ID=$SCAN_ID" >> "$GITHUB_ENV"
          echo "scan_id=$SCAN_ID" >> "$GITHUB_OUTPUT"
          echo "Generated SCAN_ID = $SCAN_ID"

      - name: Resolve repository URL and branch
        run: |
          # For workflow_dispatch: use provided inputs
          # For push/pull_request: default to the current repository
          if [ -n "${{ github.event.inputs.repo_url }}" ]; then
            echo "REPO_URL=${{ github.event.inputs.repo_url }}" >> "$GITHUB_ENV"
          else
            echo "REPO_URL=https://github.com/${{ github.repository }}.git" >> "$GITHUB_ENV"
          fi

          if [ -n "${{ github.event.inputs.branch }}" ]; then
            echo "BRANCH=${{ github.event.inputs.branch }}" >> "$GITHUB_ENV"
          else
            REF="${GITHUB_REF##refs/heads/}"
            echo "BRANCH=${REF:-main}" >> "$GITHUB_ENV"
          fi

      - name: Print scan parameters
        run: |
          echo "========================================"
          echo "  SCAN_ID  = $SCAN_ID"
          echo "  REPO_URL = $REPO_URL"
          echo "  BRANCH   = $BRANCH"
          echo "========================================"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      # ---- Install Checkov ----
      - name: Install Checkov
        run: |
          pip install checkov
          echo "Checkov installed successfully."

      - name: Print Checkov version
        run: |
          checkov --version
          echo "Checkov version confirmed."

      # ---- Pipeline stages ----
      - name: "Stage 1: Clone target repository"
        run: python scripts/clone_repository.py

      - name: "Stage 2: Generate scan metadata (SHA256 hashes)"
        run: python scripts/generate_scan_metadata.py

      - name: "Stage 3: Discover Terraform directories"
        run: python scripts/discover_terraform.py

      - name: "Stage 4: Terraform validation (fmt / init / validate)"
        id: terraform_validation
        continue-on-error: true
        run: python scripts/terraform_validate.py

      # ---- Checkov Static Security Scanning ----
      - name: "Stage 5: Checkov static security scan"
        id: checkov_scan
        if: steps.terraform_validation.outcome == 'success'
        continue-on-error: true
        run: |
          echo "========================================"
          echo "  Checkov Static Security Scan"
          echo "  SCAN_ID  = $SCAN_ID"
          echo "  Target   = repositories/cloned/$SCAN_ID"
          echo "========================================"

          # Create output directory
          mkdir -p "reports/static/$SCAN_ID"

          # Run Checkov recursively against the cloned repository
          checkov \
            -d "repositories/cloned/$SCAN_ID" \
            -o json \
            --output-file-path "reports/static/$SCAN_ID" \
            || true

          # Checkov outputs results_json.json by default when using --output-file-path
          # Rename to our expected filename if the default output exists
          if [ -f "reports/static/$SCAN_ID/results_json.json" ]; then
            mv "reports/static/$SCAN_ID/results_json.json" "reports/static/$SCAN_ID/checkov-report.json"
            echo "Checkov report saved to reports/static/$SCAN_ID/checkov-report.json"
          else
            echo "WARNING: Checkov did not produce expected output file."
            echo "Checking for any JSON output..."
            ls -la "reports/static/$SCAN_ID/" || true
          fi

      - name: "Stage 5a: Checkov scan skipped (validation failed)"
        if: steps.terraform_validation.outcome != 'success'
        run: |
          echo "========================================"
          echo "  Checkov scan SKIPPED"
          echo "  Reason: Terraform validation failed"
          echo "  SCAN_ID = $SCAN_ID"
          echo "========================================"
          echo "Terraform validation must pass before Checkov scanning."
          echo "Validation reports are still uploaded as artifacts."

      # ---- Normalize Checkov Findings ----
      - name: "Stage 6: Normalize Checkov findings"
        if: steps.terraform_validation.outcome == 'success'
        run: |
          echo "Normalizing Checkov findings for SCAN_ID = $SCAN_ID"
          python scripts/normalize_checkov.py

      # ---- Generate Forensic Summary ----
      - name: "Stage 7: Generate Checkov forensic summary"
        if: steps.terraform_validation.outcome == 'success'
        run: |
          echo "Generating forensic summary for SCAN_ID = $SCAN_ID"
          python scripts/checkov_forensic_summary.py

      # ---- Artifacts (always upload, even on failure) ----
      - name: Upload scan metadata artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-metadata-${{ steps.scan.outputs.scan_id }}
          path: repositories/metadata/${{ steps.scan.outputs.scan_id }}/

      - name: Upload validation and Checkov report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: static-reports-${{ steps.scan.outputs.scan_id }}
          path: reports/static/${{ steps.scan.outputs.scan_id }}/

      # ---- Future stages (not yet implemented) ----
      # - OPA/Rego policy validation
      # - Risk scoring
      # - AWS sandbox deployment
      # - Prowler runtime validation
      # - Forensic evidence package generation
