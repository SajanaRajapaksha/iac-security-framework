# =============================================================================
# config/risk/cis-mapping.yml
#
# Deterministic rule-to-canonical-control mapping.
# Each key is a source rule ID (Checkov CKV_*, Trivy AVD-*, or custom policy).
# The mapper checks source_rule_id first, then policy.policy_id.
# =============================================================================

# ---------------------------------------------------------------------------
# Checkov — Networking / Security Groups
# ---------------------------------------------------------------------------

CKV_AWS_24:
  canonical_control: PUBLIC_ADMIN_ACCESS
  control_domain: network_boundary_protection
  base_control_criticality: 10
  mandatory_block: true
  cis_controls_v8:
    - "CIS-4"
    - "CIS-6"
    - "CIS-12"
  aws_control_refs:
    - "AWS Security Hub EC2.13"
  description: "Security groups must not allow unrestricted public SSH ingress (port 22)."

CKV_AWS_260:
  canonical_control: PUBLIC_SERVICE_EXPOSURE
  control_domain: network_boundary_protection
  base_control_criticality: 7
  mandatory_block: false
  cis_controls_v8:
    - "CIS-4"
    - "CIS-12"
  aws_control_refs:
    - "AWS Security Hub EC2.19"
  description: "Security groups should not allow unrestricted public ingress to exposed services."

CKV_AWS_382:
  canonical_control: UNRESTRICTED_EGRESS
  control_domain: network_boundary_protection
  base_control_criticality: 6
  mandatory_block: false
  cis_controls_v8:
    - "CIS-4"
    - "CIS-12"
  aws_control_refs: []
  description: "Security group egress should be restricted to required destinations."

